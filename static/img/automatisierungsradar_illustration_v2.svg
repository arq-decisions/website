<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Automatisierungsradar (Illustration)"><circle cx="440" cy="350" r="290" fill="#f6f9f6" stroke="#d7e1d2" stroke-width="1.5"/><circle cx="440" cy="350" r="198" fill="#edf3ee" stroke="#d7e1d2" stroke-width="1.5"/><circle cx="440" cy="350" r="105" fill="#e3ece4" stroke="#d7e1d2" stroke-width="1.5"/><line x1="440" y1="350" x2="440.0" y2="60.0" stroke="#ffffff" stroke-width="3"/><text x="598.0" y="82.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#135b49" text-anchor="start" letter-spacing="0.8">PRÜFEN</text><line x1="440" y1="350" x2="691.1" y2="205.0" stroke="#ffffff" stroke-width="3"/><text x="756.0" y="356.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#135b49" text-anchor="start" letter-spacing="0.8">DOKUMENTIEREN</text><line x1="440" y1="350" x2="691.1" y2="495.0" stroke="#ffffff" stroke-width="3"/><text x="598.0" y="629.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#135b49" text-anchor="start" letter-spacing="0.8">AUSWERTEN</text><line x1="440" y1="350" x2="440.0" y2="640.0" stroke="#ffffff" stroke-width="3"/><text x="282.0" y="629.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#135b49" text-anchor="end" letter-spacing="0.8">PLANEN</text><line x1="440" y1="350" x2="188.9" y2="495.0" stroke="#ffffff" stroke-width="3"/><text x="124.0" y="356.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#135b49" text-anchor="end" letter-spacing="0.8">ABSTIMMEN</text><line x1="440" y1="350" x2="188.9" y2="205.0" stroke="#ffffff" stroke-width="3"/><text x="282.0" y="82.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#135b49" text-anchor="end" letter-spacing="0.8">ENTSCHEIDEN</text><rect x="406" y="249" width="68" height="20" rx="10" fill="#ffffff"/><text x="440" y="263" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#8a9397" text-anchor="middle">bis 2027</text><rect x="406" y="156" width="68" height="20" rx="10" fill="#ffffff"/><text x="440" y="170" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#8a9397" text-anchor="middle">bis 2029</text><rect x="406" y="64" width="68" height="20" rx="10" fill="#ffffff"/><text x="440" y="78" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#8a9397" text-anchor="middle">bis 2031</text><circle cx="440" cy="350" r="30" fill="#135b49"/><text x="440" y="355" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">heute</text><circle cx="501.4" cy="206.4" r="9" fill="#bb2649"/><text x="515.4" y="211.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="start">Sichtprüfung Serienteile</text><circle cx="486.7" cy="292.6" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M486.7,283.6 A9,9 0 0 1 486.7,301.6 Z" fill="#135b49"/><text x="500.7" y="297.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="start">Prüfplan erstellen</text><circle cx="513.0" cy="338.3" r="9" fill="#bb2649"/><text x="527.0" y="343.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="start">Prüfbericht schreiben</text><circle cx="593.8" cy="377.2" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M593.8,368.2 A9,9 0 0 1 593.8,386.2 Z" fill="#135b49"/><text x="607.8" y="382.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="start">Abweichung dokumentieren</text><circle cx="474.4" cy="415.5" r="9" fill="#bb2649"/><text x="488.4" y="420.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="start">Messdaten auswerten</text><circle cx="596.9" cy="542.9" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M596.9,533.9 A9,9 0 0 1 596.9,551.9 Z" fill="#135b49"/><text x="610.9" y="547.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="start">Ursachen analysieren</text><circle cx="361.9" cy="485.2" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M361.9,476.2 A9,9 0 0 1 361.9,494.2 Z" fill="#135b49"/><text x="347.9" y="490.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="end">Kapazitäten planen</text><circle cx="275.6" cy="536.5" r="9" fill="#bb2649"/><text x="261.6" y="541.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="end">Prüftermine disponieren</text><circle cx="285.8" cy="374.8" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M285.8,365.8 A9,9 0 0 1 285.8,383.8 Z" fill="#135b49"/><text x="271.8" y="379.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="end">Lieferanten bewerten</text><circle cx="194.5" cy="310.6" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M194.5,301.6 A9,9 0 0 1 194.5,319.6 Z" fill="#135b49"/><text x="180.5" y="315.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="end">Reklamation klären</text><circle cx="307.2" cy="139.8" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M307.2,130.8 A9,9 0 0 1 307.2,148.8 Z" fill="#135b49"/><text x="293.2" y="144.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3639" text-anchor="end">Freigabe erteilen</text><text x="920" y="120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#135b49" text-anchor="start" letter-spacing="0.8">AUTOMATISIERUNGSRADAR</text><text x="920" y="152.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">Jeder Punkt ist eine Aufgabe im</text><text x="920" y="173.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">Qualitätsmanagement. Je näher an der</text><text x="920" y="195.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">Mitte, desto früher wird sie</text><text x="920" y="217.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">wahrscheinlich automatisiert.</text><circle cx="930" cy="262" r="9" fill="#bb2649"/><text x="950" y="258.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2f3639" text-anchor="start">vollständig automatisiert</text><text x="950" y="279.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">Der Mensch ist nicht mehr im Prozess.</text><circle cx="930" cy="332" r="9" fill="#ffffff" stroke="#135b49" stroke-width="3"/><path d="M930,323 A9,9 0 0 1 930,341 Z" fill="#135b49"/><text x="950" y="328.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2f3639" text-anchor="start">teilweise automatisiert</text><text x="950" y="349.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">Der Mensch bleibt im Prozess,</text><text x="950" y="371.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#2f3639" text-anchor="start">die Aufgabe verändert sich.</text><rect x="920" y="430" width="290" height="58" rx="8" fill="#faf09b"/><text x="934" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5a5310" text-anchor="start">Illustration mit Beispielaufgaben,</text><text x="934" y="473.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5a5310" text-anchor="start">keine Projektdaten.</text></svg>